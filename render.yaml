# Render Blueprint for InterVAI backend
# Usage: in Render dashboard → New → Blueprint → connect this repo
# Render will read this file and provision the web service + Postgres database

services:
  - type: web
    name: intervai-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=backend
    startCommand: npm run start:migrate --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: intervai-db
          property: connectionString
      # ── Set these manually in Render dashboard ──
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_AUDIO_MODEL
        value: whisper-large-v3
      - key: CORS_ORIGIN
        sync: false
        # After Vercel deploy, set this to your Vercel URL, e.g. https://intervai.vercel.app

databases:
  - name: intervai-db
    region: oregon
    plan: free
    databaseName: intervai
    user: intervai
